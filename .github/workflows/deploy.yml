name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-website-school
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean staging dir (только отслеживаемые файлы сайта)
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          git archive HEAD -- $(git ls-files | grep -vE '^\.github/') | tar -x -C "$RUNNER_TEMP/site"

      - name: Deploy to workers.dev (assets-only worker website-school)
        working-directory: ${{ runner.temp }}/site
        run: npx --yes wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
